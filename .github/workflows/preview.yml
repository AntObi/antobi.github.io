name: PR preview

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    name: Publish PR preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - if: github.event.action != 'closed'
        run: npm install --no-audit --no-fund
      - name: Build preview
        if: github.event.action != 'closed'
        run: BASE_PATH="/pr-preview/pr-${{ github.event.pull_request.number }}" npm run build
      - name: Deploy or remove preview
        uses: rossjrw/pr-preview-action@v1
        with:
          token: ${{ secrets.PAGES_TOKEN }}
          git-config-name: AntObi
          git-config-email: 30937913+AntObi@users.noreply.github.com
          source-dir: build
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
          comment: true
          qr-code: false
          pages-base-url: antobi.github.io
          wait-for-pages-deployment: false
