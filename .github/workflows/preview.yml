name: PR preview

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    name: Publish PR preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      JEKYLL_ENV: production

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Ruby
        if: github.event.action != 'closed'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: |
          gem install bundler
          bundle config set path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Build preview
        if: github.event.action != 'closed'
        run: |
          cat > _config.preview.yml <<EOF
          url: "https://antobi.github.io"
          baseurl: "/pr-preview/pr-${{ github.event.pull_request.number }}"
          EOF
          bundle exec jekyll build --trace --config _config.yml,_config.preview.yml

      - name: Deploy or remove preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
          comment: true
          qr-code: false
          wait-for-pages-deployment: false
